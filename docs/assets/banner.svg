      <stop stop-color="#111d30"/>
      <stop offset="1" stop-color="#192d46"/>
    </linearGradient>
    <linearGradient id="icon" x2="0" y2="1">
      <stop stop-color="#57aaf4"/>
      <stop offset="1" stop-color="#3085d7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="480" rx="24" fill="url(#background)"/>
  <circle cx="1420" cy="130" r="330" fill="none" stroke="#c3ddff" stroke-opacity=".05"/>
  <circle cx="1420" cy="130" r="240" fill="none" stroke="#c3ddff" stroke-opacity=".05"/>
