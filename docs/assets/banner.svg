<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">Thongs 3 — Your day. In focus.</title>
  <desc id="description">An offline task manager for Windows. Original blue checkmark branding with a decorative three-step capture, plan, and complete motif.</desc>
  <defs>
